  body { background:radial-gradient(1100px 480px at 50% -80px, rgba(255,46,77,.10), transparent 70%), var(--bg);

  ::selection { background:rgba(255,46,77,.35); }
  .wrap { max-width:860px; margin:0 auto; padding:48px 20px 56px; }
  header h1 { font-size:27px; font-weight:700; letter-spacing:.3px;

  .logo-pill { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff;

  textarea:focus { outline:none; border-color:var(--acc);
                   box-shadow:0 0 0 3px rgba(255,46,77,.15); }
  .row { display:flex; gap:12px; margin-top:14px; align-items:center; flex-wrap:wrap; }
  button.primary { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff;

  .result { display:none; margin-top:20px; }
  .card { padding:20px; animation:rise .35s ease; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } }
  .meta { display:flex; gap:18px; }
  .meta img { width:126px; height:168px; object-fit:cover; border-radius:12px;
              background:#222; flex:none; }
  .info { min-width:0; }
  .info h2 { font-size:18px; line-height:1.5; word-break:break-all; }

  .actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .btn { border-radius:10px; padding:9px 18px; font-size:14px; cursor:pointer;
         text-decoration:none; display:inline-block; border:1px solid var(--line);
         background:var(--inner); color:var(--txt);
         transition:border-color .15s, transform .15s; }
  .btn:hover { border-color:var(--acc); transform:translateY(-1px); }
  .btn.dl { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff;
            border:none; font-weight:600; }
  .twrap { overflow-x:auto; margin-top:6px; }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:14px; }
  th { color:var(--dim); font-weight:500; font-size:12.5px; text-align:left;

  td { padding:11px 10px; border-top:1px solid var(--line); }
  tbody tr { transition:background .15s; }

  td.url { color:var(--dim); font-size:12px; max-width:0; overflow:hidden;

  .tag { color:var(--acc2); font-size:12px; margin-left:6px; }
  .small { color:var(--acc2); background:none; border:1px solid #4a2a33;

  .small:hover { background:#2a1d22; }
  footer { margin-top:34px; color:#6b7280; font-size:12.5px; line-height:1.8;

  #toast { position:fixed; left:50%; bottom:36px; transform:translateX(-50%);
           background:#262b36; color:var(--txt); padding:9px 20px; border-radius:20px;

  #toast.show { opacity:1; }
  @media (max-width:640px) {
    .wrap { padding:28px 12px 40px; }
    header h1 { font-size:22px; }
    .meta { flex-direction:column; }
    .meta img { width:100%; height:auto; max-height:300px; }
    button.primary { width:100%; }
    .actions .btn { flex:1; text-align:center; }
  }
</style>

<body>
<div class="wrap">
  <header>
    <h1><span class="logo-pill">RED</span>小红书视频下载器<span class="sub">纯网页版</span></h1>
  </header>

  <div class="box">
    <textarea id="link" placeholder="粘贴小红书分享链接（App 短链 / 完整链接 / 整段分享文案都行）"></textarea>
    <div class="row">
      <button class="primary" id="go">提取视频</button>
      <span class="hint">链接里的 xsec_token 参数别删</span>
    </div>
    <div class="spin" id="spin">正在通过代理解析，最多约 1 分钟…</div>
    <div class="err" id="err"></div>
    <details class="cfg">
      <summary>⚙️ 设置：自建代理（推荐，稳定且不经过第三方）</summary>
      <div class="cfgrow">
        <input id="workerUrl" placeholder="自建代理地址，如 https://xxx.pages.dev/api 或 https://xxx.workers.dev">
        <button id="saveCfg">保存</button>
        <button id="clearCfg">清除</button>

  <div class="result" id="result">
    <div class="card">
      <div class="meta">
        <img id="cover" alt="" hidden>
        <div class="info">

        </div>
      </div>

      <div class="vfail" id="vfail">页面内预览被 CDN 拦截了（正常现象）。点「打开/下载视频」用浏览器直接播放，播放器右下角就有下载按钮。</div>
      <div class="actions">
        <a class="btn dl" id="dlBest" href="#" target="_blank" rel="noopener noreferrer">打开/下载视频</a>
        <button class="btn" id="copyBest">复制视频直链</button>
      </div>
      <div class="twrap">
      <table id="streamTable">
        <thead><tr><th>编码</th><th>分辨率</th><th>大小 / 时长</th><th>直链</th><th></th></tr></thead>
        <tbody id="streamBody"></tbody>
      </table>
      </div>
    </div>
  </div>

  <footer>仅供个人学习、存档使用；下载内容版权归原作者所有。</footer>
</div>
<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
let DATA = null;

/* ------------------------------------------------ 工具 */
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove("show"), 1600);
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtSize(b) { return b ? (b/1048576).toFixed(1) + " MB" : "—"; }
function fmtDur(ms) {
  if (!ms) return "—";
  const s = Math.round(ms/1000);
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}

/* ------------------------------------------------ 代理链 */
// 部署自己的代理后，把地址填到这里（结尾不带斜杠），所有人打开页面即默认使用：
//   Netlify:        https://你的站点.netlify.app/api
//   Cloudflare:     https://你的站点.pages.dev/api   (仅老账号可用)
const DEFAULT_PROXY = "https://xhsdownload.netlify.app/api";

function workerBase() { return (localStorage.getItem("xhsWorkerUrl") || "").trim() || DEFAULT_PROXY; }

const PUBLIC_PROXIES = [
  u => ({ name: "cors.lol",     url: "https://api.cors.lol/?url=" + encodeURIComponent(u) }),
  u => ({ name: "cors.eu.org",  url: "https://cors.eu.org/" + u }),
  u => ({ name: "allorigins",   url: "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) }),
  u => ({ name: "codetabs",     url: "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u) }),
];

function proxyChain(target) {
  const chain = [];
  const w = workerBase();
  if (w) chain.push({ name: "自建代理", url: w.replace(/\/+$/, "") + "/?url=" + encodeURIComponent(target) });
  const pubs = PUBLIC_PROXIES.map(f => f(target));
  const last = localStorage.getItem("xhsLastProxy");  // 上次成功的公共代理优先
  if (last) {
    const hit = pubs.find(p => p.name === last);
    if (hit) chain.push(hit);
  }
  for (const p of pubs) if (!chain.includes(p)) chain.push(p);
  return chain;
}

async function tryFetch(url, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || 15000);
  try {
    const r = await fetch(url, { signal: ctrl.signal, redirect: "follow" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  } finally { clearTimeout(t); }
}

const looksLikeNotePage = t => t.length > 3000 &&
  (t.includes("__INITIAL_STATE__") || t.includes("masterUrl") || t.includes("noteDetailMap"));
const isBlockedPage = t => t.includes("验证") || t.toLowerCase().includes("captcha");

async function fetchViaProxies(target) {
  const errors = [];
  for (const item of proxyChain(target)) {
    try {
      const text = await tryFetch(item.url, 20000);
      if (looksLikeNotePage(text)) {
        localStorage.setItem("xhsLastProxy", item.name);
        return { text, via: item.name };
      }
      errors.push(item.name + "：返回内容里没有笔记数据" + (isBlockedPage(text) ? "（触发风控/需登录）" : ""));
    } catch (e) {
      errors.push(item.name + "：" + (e.name === "AbortError" ? "超时" : e.message));
    }
  }
  throw new Error("所有代理都失败了：\n" + errors.join("\n") +
                  "\n公共代理限流时通常几分钟后会恢复，可稍后再试；或在「⚙️ 设置」里配置自己的代理（免费，3 分钟，见仓库 worker.js）。");
}

/* ------------------------------------------------ 解析（与 Python 版同逻辑） */
function normalizeUrl(raw) {
  raw = raw.trim().replace(/^["'<>，。\s]+|["'>，。\s]+$/g, "");
  const m = raw.match(/https?:\/\/[^\s"'<>#]+/);
  let url = m ? m[0] : raw;
  if (!/^https?:\/\//.test(url)) url = "https://" + url;
  return url.split("#")[0];
}
function extractNoteId(url) {
  let m = url.match(/\/(?:explore|discovery\/item)\/([0-9a-fA-F]{24})/);
  if (m) return m[1];
  for (const part of url.split(/[\/?&=]/))
    if (/^[0-9a-fA-F]{24}$/.test(part)) return part;
  return null;
}
function extractState(html) {
  const i = html.indexOf("window.__INITIAL_STATE__");
  if (i < 0) return null;
  const start = html.indexOf("{", i);
  if (start < 0) return null;
  let depth = 0, inStr = false, escFlag = false;
  for (let j = start; j < html.length; j++) {
    const c = html[j];
    if (inStr) {
      if (escFlag) escFlag = false;
      else if (c === "\\") escFlag = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === "{") depth++;
    else if (c === "}") {
      depth--;
      if (depth === 0) {
        const raw = html.slice(start, j + 1).replace(/([:,\[])\s*(undefined|NaN)/g, "$1null");
        try { return JSON.parse(raw); } catch (e) { return null; }
      }
    }
  }
  return null;
}
function findNote(state, nid) {
  const dm = (state && state.note && state.note.noteDetailMap) || {};
  const entry = dm[nid] || Object.values(dm)[0];
  if (entry && entry.note) return entry.note;
  let found = null;
  (function walk(o) {
    if (found || !o || typeof o !== "object") return;
    if (Array.isArray(o)) { for (const v of o) walk(v); return; }
    if ((o.video || o.imageList) && (o.title != null || o.user)) { found = o; return; }
    for (const v of Object.values(o)) { walk(v); if (found) return; }
  })(state);
  return found;
}
const CODEC_KEYS = ["h264", "h265", "h266", "av1"];
function collectStreams(obj, out, codec) {
  if (!obj || typeof obj !== "object") return;
  if (Array.isArray(obj)) { for (const v of obj) collectStreams(v, out, codec); return; }
  if (obj.masterUrl) out.push({
    codec: codec || "?", url: obj.masterUrl,
    bitrate: obj.videoBitrate || 0, width: obj.width || 0, height: obj.height || 0,
    duration: obj.duration || 0, size: obj.size || 0,
  });
  for (const [k, v] of Object.entries(obj))
    collectStreams(v, out, CODEC_KEYS.includes(k) ? k : codec);
}
const streamScore = (s, pref) =>
  ((s.codec === pref) ? 1e12 : 0) + (s.bitrate || 0) * 1e3 + (s.width || 0) * (s.height || 0);

/* ------------------------------------------------ 主流程 */
async function extract() {
  const input = $("#link").value.trim();
  if (!input) { toast("先粘贴链接哦"); return; }
  $("#go").disabled = true;
  $("#spin").style.display = "block";
  $("#err").style.display = "none";
  $("#result").style.display = "none";
  try {
    const url = normalizeUrl(input);
    if (!/(xiaohongshu\.com|xhslink\.com)/.test(url))
      throw new Error("这看起来不是小红书链接，请粘贴 App 里「复制链接」得到的内容");
    const { text, via } = await fetchViaProxies(url);
    const state = extractState(text);
    const note = state ? findNote(state, extractNoteId(url)) : null;
    let streams = [], title = "", author = "";
    if (note) {
      collectStreams(note, streams);
      const uniq = {}; streams.forEach(s => uniq[s.url] = s);
      streams = Object.values(uniq);
      title = (note.title || note.desc || "").trim();
      author = (note.user && note.user.nickname) || "";
    } else {
      const re = /"masterUrl"\s*:\s*"([^"]+)"/g;
      let m;
      while ((m = re.exec(text))) {
        try {
          streams.push({ codec: "h264", url: JSON.parse('"' + m[1] + '"'),
                         bitrate: 0, width: 0, height: 0, duration: 0, size: 0 });
        } catch (e) {}
      }
      const mt = text.match(/<title>([^<]*)<\/title>/);
      if (mt) title = mt[1];
    }
    if (!streams.length) {
      if (note && note.type === "normal") throw new Error("这是图文笔记(无视频)，跳过：" + title.slice(0, 40));
      throw new Error("没找到视频流：链接可能失效，或该笔记需要登录/被风控（公共代理无法带登录态，请用完整版）");
    }
    // https 页面里加载 http 资源会被浏览器当混合内容拦截，视频 CDN 支持 https，统一升级
    streams.forEach(s => { s.url = s.url.replace(/^http:\/\//, "https://"); });
    DATA = { title, author, cover: findCover(note), streams,
             best: streams.reduce((a, b) => streamScore(b, "h264") > streamScore(a, "h264") ? b : a),
             via };
    render();
  } catch (e) {
    $("#err").textContent = "✗ " + e.message;
    $("#err").style.display = "block";
  } finally {
    $("#spin").style.display = "none";
    $("#go").disabled = false;
  }
}

function findCover(note) {
  let found = null;
  (function walk(o, d) {
    if (found || d > 12 || !o || typeof o !== "object") return;
    if (Array.isArray(o)) { for (const v of o) walk(v, d + 1); return; }
    for (const k of ["urlDefault", "urlPre", "url"]) {
      if (typeof o[k] === "string" && o[k].startsWith("http")) { found = o[k]; return; }
    }
    for (const v of Object.values(o)) { walk(v, d + 1); if (found) return; }
  })(note ? (note.imageList || note.video || note) : null, 0);
  return found;
}

function render() {
  const d = DATA, best = d.best;
  $("#title").textContent = d.title || "(无标题)";
  $("#author").textContent = d.author ? "作者：" + d.author : "";
  $("#via").textContent = "解析通道：" + d.via;
  $("#badges").innerHTML =
    `<span class="badge">${esc(best.codec)}</span>` +
    (best.width ? `<span class="badge">${best.width}×${best.height}</span>` : "");

  const img = $("#cover");
  img.onerror = () => { img.hidden = true; };  // 浏览器直连 CDN 图片常被拒，封面走代理
  if (d.cover) {
    const w = workerBase();
    img.src = (w ? w.replace(/\/+$/, "") + "/?url=" : "https://api.cors.lol/?url=") +
              encodeURIComponent(d.cover);
    img.hidden = false;
  } else img.hidden = true;

  const v = $("#player");
  v.onerror = () => {
    if (!v.dataset.proxied) {  // 直连被 CDN 拒 → 改走代理再试一次
      v.dataset.proxied = "1";
      const w = workerBase();
      v.src = (w ? w.replace(/\/+$/, "") + "/?url=" : "https://api.cors.lol/?url=") +
              encodeURIComponent(best.url);
    } else {
      v.style.display = "none";
      $("#vfail").style.display = "block";
    }
  };
  v.style.display = "block"; $("#vfail").style.display = "none";
  v.removeAttribute("data-proxied");
  v.src = best.url;

  $("#dlBest").href = best.url;
  $("#streamBody").innerHTML = d.streams.map(s => {
    const isBest = s.url === best.url;
    return `<tr>
      <td>${esc(s.codec)}${isBest ? '<span class="tag">推荐</span>' : ""}</td>
      <td>${s.width ? s.width + "×" + s.height : "—"}</td>
      <td>${fmtSize(s.size)} / ${fmtDur(s.duration)}</td>
      <td class="url" title="${esc(s.url)}">${esc(s.url)}</td>
      <td style="white-space:nowrap">
        <a class="btn dl" style="padding:5px 12px;font-size:13px" target="_blank"
           rel="noopener noreferrer" href="${esc(s.url)}">打开</a>
        <button class="small" data-url="${esc(s.url)}">复制</button>
      </td>
    </tr>`;
  }).join("");
  $("#streamBody").querySelectorAll("button[data-url]").forEach(b =>
    b.addEventListener("click", () => copyText(b.dataset.url)));

  $("#result").style.display = "block";
  $("#result").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("直链已复制，可粘贴到浏览器打开/下载");
}

/* ------------------------------------------------ 设置 */
function refreshCfg() {
  const w = workerBase();
  $("#cfgState").textContent = w ? "✓ 已配置自建代理，将优先使用" : "未配置，当前使用公共代理列表";
}
$("#saveCfg").addEventListener("click", () => {
  const v = $("#workerUrl").value.trim();
  if (v && !/^https?:\/\//.test(v)) { toast("地址要以 http(s):// 开头"); return; }
  localStorage.setItem("xhsWorkerUrl", v);
  refreshCfg(); toast(v ? "已保存，将优先走自建代理" : "已清除");
});
$("#clearCfg").addEventListener("click", () => {
  $("#workerUrl").value = "";
  localStorage.removeItem("xhsWorkerUrl");
  refreshCfg(); toast("已清除");
});
$("#workerUrl").value = workerBase();
refreshCfg();

$("#go").addEventListener("click", extract);
$("#copyBest").addEventListener("click", () => DATA && copyText(DATA.best.url));
$("#link").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) extract();
});
</script>
</body>
</html>
